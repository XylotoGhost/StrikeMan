name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: Compress-Archive -Path build/bin/StrikeMan.exe -DestinationPath StrikeMan-windows.zip
            artifact: StrikeMan-windows.zip
          - os: macos-latest
            package: ditto -c -k --keep-parent build/bin/StrikeMan.app StrikeMan-macos.zip
            artifact: StrikeMan-macos.zip
          - os: ubuntu-latest
            package: tar -czf StrikeMan-linux.tar.gz -C build/bin StrikeMan
            artifact: StrikeMan-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41

      - name: Build
        if: runner.os != 'Linux'
        run: wails build

      - name: Package
        run: ${{ matrix.package }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
