name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # The tag becomes the version the app reports and compares against when
      # checking for updates.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -ldflags "-X main.version=${{ github.ref_name }}"

      # -nsis additionally produces the per-user installer.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -nsis -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf StrikeMan-linux.tar.gz -C build/bin StrikeMan

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent build/bin/StrikeMan.app StrikeMan-macos.zip
          hdiutil create -volname StrikeMan -srcfolder build/bin/StrikeMan.app \
            -ov -format UDZO StrikeMan-macos.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/StrikeMan.exe -DestinationPath StrikeMan-windows.zip
          $installer = Get-ChildItem build/bin/*installer.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS did not produce an installer" }
          Copy-Item $installer.FullName StrikeMan-windows-installer.exe

      # A .sha256 next to every download, so the in-app updater can verify
      # what it fetched and anyone can check a manual download.
      - name: Checksums
        shell: bash
        run: |
          for file in StrikeMan-*.zip StrikeMan-*.tar.gz StrikeMan-*.dmg StrikeMan-*installer.exe; do
            [ -e "$file" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
            cat "$file.sha256"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StrikeMan-*.zip
            StrikeMan-*.tar.gz
            StrikeMan-*.dmg
            StrikeMan-*installer.exe
            StrikeMan-*.sha256
